appId: app.quill.desktop
productName: Quill
directories:
  output: release
  buildResources: public
files:
  - ".next/**/*"
  - "dist-electron/**/*"
  - "public/**/*"
  - "package.json"
  - "node_modules/**/*"
extraMetadata:
  main: dist-electron/main/index.js
asar: true
mac:
  category: public.app-category.productivity
  icon: public/logo.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  icon: public/logo.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: public/logo.png
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
