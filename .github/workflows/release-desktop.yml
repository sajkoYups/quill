name: Release Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            npm_script: dist:win
            artifact_name: quill-windows
          - os: macos-latest
            npm_script: dist:mac
            artifact_name: quill-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace package
        run: npm run build -w @quill/shared

      - name: Build and package desktop app
        run: npm run ${{ matrix.npm_script }} -w @quill/desktop

      - name: Collect installers for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            win_installer=$(ls apps/desktop/release/*.exe | head -n 1)
            cp "$win_installer" release-upload/windows-latest.exe
          else
            mac_installer=$(ls apps/desktop/release/*arm64*.dmg | head -n 1)
            cp "$mac_installer" release-upload/macos-latest.dmg
          fi

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-upload/*
          if-no-files-found: error

  publish-r2:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: quill-macos
          path: release-assets/macos

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: quill-windows
          path: release-assets/windows

      - name: Validate required R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"

      - name: Upload versioned and latest installers to R2
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp release-assets/macos/macos-latest.dmg \
            "s3://$R2_BUCKET/releases/$RELEASE_TAG/macos-latest.dmg" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release-assets/windows/windows-latest.exe \
            "s3://$R2_BUCKET/releases/$RELEASE_TAG/windows-latest.exe" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp release-assets/macos/macos-latest.dmg \
            "s3://$R2_BUCKET/mac/latest.dmg" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release-assets/windows/windows-latest.exe \
            "s3://$R2_BUCKET/win/latest.exe" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Verify latest objects exist
        shell: bash
        run: |
          set -euo pipefail
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "mac/latest.dmg" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "win/latest.exe" \
            --endpoint-url "$R2_ENDPOINT"
